<!doctype html>

  <head>
    <script>
      (function () {
        if (typeof window === 'undefined') return;

        // 1. Intercept Vite HMR WebSocket so it never attempts or fails connection in cloud iframe
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          var ViteHmrWebSocket = function (url, protocols) {
            var isHmr =
              protocols === 'vite-hmr' ||
              (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('token=') !== -1));
            if (isHmr) {
              var listeners = {};
              return {
                readyState: 1, // WebSocket.OPEN
                OPEN: 1,
                CLOSED: 3,
                CLOSING: 2,
                CONNECTING: 0,
                send: function () {},
                close: function () {},
                addEventListener: function (event, handler) {
                  if (!listeners[event]) listeners[event] = [];
                  listeners[event].push(handler);
                  if (event === 'open') {
                    setTimeout(function () {
                      try { handler(new Event('open')); } catch (e) {}
                    }, 0);
                  }
                },
                removeEventListener: function (event, handler) {
                  if (!listeners[event]) return;
                  listeners[event] = listeners[event].filter(function (h) { return h !== handler; });
                },
                dispatchEvent: function () { return true; }
              };
            }
            return new NativeWebSocket(url, protocols);
          };
          ViteHmrWebSocket.prototype = NativeWebSocket.prototype;
          ViteHmrWebSocket.CONNECTING = 0;
          ViteHmrWebSocket.OPEN = 1;
          ViteHmrWebSocket.CLOSING = 2;
          ViteHmrWebSocket.CLOSED = 3;
          window.WebSocket = ViteHmrWebSocket;
        }

        // 2. Suppress benign Vite HMR WebSocket notices in error events and console
        var isWsError = function (err) {
          if (!err) return false;
          var str = typeof err === 'string' ? err : (err.message || '') + ' ' + (err.stack || '');
          return (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('@vite/client') !== -1 ||
            str.indexOf('vite-hmr') !== -1
          );
        };

        window.addEventListener(
          'error',
          function (event) {
            if (isWsError(event.error) || isWsError(event.message)) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return true;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            if (isWsError(event.reason)) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return true;
            }
          },
          true
        );

        var origConsoleError = console.error;
        console.error = function () {
          for (var i = 0; i < arguments.length; i++) {
            if (
              isWsError(arguments[i]) ||
              (typeof arguments[i] === 'string' && arguments[i].indexOf('[vite]') !== -1 && isWsError(arguments[i + 1]))
            ) {
              return;
            }
          }
          origConsoleError.apply(console, arguments);
        };
      })();
    </script>
